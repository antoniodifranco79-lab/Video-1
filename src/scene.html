const planets={};
for(const p of PL){ if(p.name==='earth') planets.earth=makeEarth(p.size); else planets[p.name]=makePlanet(p); }

// ---------- planetary nebula (appears at collapse)

{ const N=9000;const pos=new Float32Array(N*3),col=new Float32Array(N*3),spd=new Float32Array(N);const r=mulberry32(321);

// ---------- engulf timing (precompute by scanning sunR) ----------
function sunR(t){
 if(t<T.SWELL) return 1.0;
 if(t<T.INNER) return lerp(1.0,2.6,easeIn(u01(t,T.SWELL,T.INNER)));
 if(t<T.EARTH) return lerp(2.6,5.4,easeInOut(u01(t,T.INNER,T.EARTH)));
 if(t<T.ENGULF) return lerp(5.4,6.5,easeInOut(u01(t,T.EARTH,T.ENGULF)));
 if(t<T.NEBULA) return lerp(6.5,7.9,easeInOut(u01(t,T.ENGULF,T.NEBULA)));
 if(t<T.COLLAPSE_END) return lerp(7.9,0.17,easeOut(u01(t,T.NEBULA,T.COLLAPSE_END)));
 return 0.17;
}
const engulfT={};
for(const p of PL){ engulfT[p.name]=Infinity;
 for(let t=0;t<=T.NEBULA;t+=0.02){ if(sunR(t)>=p.r-p.size*0.6){engulfT[p.name]=t;break;} } }

// ---------- sun tint over time
function sunColors(t){
 const red=sm(u01(t,T.SWELL,T.ENGULF));           // 0 yellow-white -> 1 deep red
 if(t<T.NEBULA){
  const a=CGET(0xffe6ac).lerp(CGET(0xffb858),red*0.7).lerp(CGET(0xff8238),Math.max(0,red-0.45)/0.55);
  const b=CGET(0xca7322).lerp(CGET(0xa83c12),red).lerp(CGET(0x6e2406),Math.max(0,red-0.5)/0.5);
  return {a,b,corona:CGET(0xff9636).lerp(CGET(0xf2420f),red),light:CGET(0xffe4bc).lerp(CGET(0xffa858),red)};
 } else {
  // white dwarf: hot blue-white
  const k=sm(u01(t,T.NEBULA,T.DWARF));
  const a=CGET(0xfff0d0).lerp(CGET(0xe6f0ff),k);
  const b=CGET(0xc85a24).lerp(CGET(0x86a8e0),k);
  return {a,b,corona:CGET(0xf2420f).lerp(CGET(0x8ab4ff),k),light:CGET(0xffc090).lerp(CGET(0xcfe0ff),k)};
 }
}

// ---------- state
const _tmp=new THREE.Vector3(),_tmp2=new THREE.Vector3();
const state={sunR:1,positions:{}};
function planetGroupOf(name){return name==='earth'?planets.earth.grp:planets[name].grp;}

function updateWorld(t){
 sunUniforms.uTime.value=t;
 const R=sunR(t);state.sunR=R;
 sunGroup.scale.setScalar(R);
 const col=sunColors(t);
 sunUniforms.uColA.value.copy(col.a);sunUniforms.uColB.value.copy(col.b);

 // luminosity: swells bright, white dwarf tiny but hot

 sunLight.intensity=lum; sunUniforms.uBright.value = t<T.NEBULA?0.72:1.05;
 coronaU.uInt.value = t<T.NEBULA?lerp(0.5,0.95,sm(u01(t,T.SWELL,T.ENGULF))):0.45;
 const gs=R*(t<T.NEBULA?2.9:13.0);glowSpr.scale.set(gs,gs,1);
 glowSpr.material.color.copy(col.corona);glowSpr.material.opacity=t<T.NEBULA?0.32:0.28;

 // planets
 for(const p of PL){
  const grp=planetGroupOf(p.name);
  const a=p.a0+p.w*t;grp.position.set(p.r*Math.cos(a),0,p.r*Math.sin(a));
  grp.getWorldPosition(_tmp);state.positions[p.name]=_tmp.clone();
  const te=engulfT[p.name];const gone=t>=te;
  grp.visible=!gone;
  // heat emissive as sun approaches (time-based)
  const heat= isFinite(te)? sm(u01(t,te-2.6,te)) : 0;
  if(p.name!=='earth'){ planets[p.name].mat.emissiveIntensity=heat*2.2; }
 }
 // EARTH specifics
 const E=planets.earth;const te=engulfT.earth;
 E.spin.rotation.y=2.6+0.05*t;E.clouds.rotation.y=0.015*t;
 // sun dir (world) at earth = toward origin
 E.grp.getWorldPosition(_tmp);const sdir=_tmp.clone().negate().normalize();
 E.atmoU.uSunDir.value.copy(sdir);
 // heat/scorch ramp up to engulf
 const heatE=sm(u01(t,T.EARTH+0.4,Math.min(te,T.ENGULF+1.2)));
 earthUniforms.uLavaAmt.value=heatE;earthUniforms.uScorch.value=heatE*0.9;earthUniforms.uLightsAmt.value=1-heatE;
 E.cloudMat.opacity=1-0.9*heatE;E.cloudMat.color.copy(CGET(0xffffff).lerp(CGET(0x6a5248),heatE));
 E.atmoU.uColor.value.copy(CGET(0x3d8bff).lerp(CGET(0xff6a20),heatE));E.atmoU.uInt.value=1+0.6*heatE;

 // orbit rings fade as sun swallows / nebula
 const ringFade=1-sm(u01(t,T.ENGULF,T.NEBULA+0.5));
 for(let i=0;i<ringMats.length;i++){ const gone=t>=engulfT[PL[i].name]; ringMats[i].opacity=(gone?0:1)*0.5*ringFade; }

 // nebula
 if(t>=T.NEBULA){
  const age=t-T.NEBULA;
  nebMat.uniforms.uRad.value=lerp(0.9,20.0,easeOut(u01(t,T.NEBULA,T.END+1.5)));
  const op=Math.min(sm(u01(age,0.2,2.6)),1-sm(u01(t,T.DWARF+1.6,T.END+0.6)));
  nebMat.uniforms.uOp.value=op*0.5;
  nebMat.uniforms.uPt.value=lerp(1.6,0.6,u01(t,T.NEBULA,T.END));
  nebula.rotation.y=0.05*age;nebula.visible=true;
 } else { nebMat.uniforms.uOp.value=0;nebula.visible=false; }
}

const shots=[
 // hook: wide system, slow push-in

 // cta: pull back through nebula
 {t0:T.CTA,t1:T.END+1,fov:58,shake:0,cam:(u)=>({pos:V(0,1.0+0.6*u,9.0+6.0*u),tgt:V(0,0.2,0)})},

function updateCamera(t){
 let sh=shots[shots.length-1];for(const s of shots){if(t>=s.t0&&t<s.t1){sh=s;break;}}

 // earth day/night terminator in view space
 const E=planets.earth;E.grp.getWorldPosition(_tmp);const sdv=_tmp.clone().negate().normalize().transformDirection(camera.matrixWorldInverse);

function project(v){const p=v.clone().project(camera);return{x:(p.x*0.5+0.5)*W,y:(-p.y*0.5+0.5)*H,z:p.z};}
function updateUI(t){
 let html='',cls='';
 for(const s of TL.sentences){
  if(t<s.chunks[0].s-0.08||t>s.end+0.35)continue;
  for(let i=0;i<s.chunks.length;i++){const ch=s.chunks[i];const next=s.chunks[i+1];const hold=next?next.s:ch.e+0.35;
   if(t>=ch.s-0.08&&t<hold){
    const words=(s.id==='hook')?s.words:ch.words;
    html=words.map(w=>{const st=t<w.s?'future':(t<w.e+0.04?'hot':'past');const pop=st==='hot'?1+0.10*(1-u01(t,w.s,w.s+0.16)):1;return `<span class="${st}" style="transform:scale(${pop.toFixed(3)})">${w.w}</span>`}).join(' ');
    const a=u01(t,ch.s-0.08,ch.s+0.1);const sc=0.9+0.1*easeOut(a);
    capEl.style.opacity=a;capEl.style.transform=`translate(-50%,-50%) scale(${sc.toFixed(3)})`;
    cls=s.id==='hook'?'title':'';break;}
  }
  if(html)break;
 }
 capEl.innerHTML=html;capEl.className=cls;if(!html)capEl.style.opacity=0;
 const ca=t>=T.CTA?sm(u01(t,T.CTA,T.CTA+0.5)):0;ctaEl.style.opacity=ca;ctaEl.style.transform=`translateX(-50%) translateY(${(1-ca)*30}px)`;
 for(const c of callouts){const a=Math.min(sm(u01(t,c.t0,c.t0+0.35)),1-sm(u01(t,c.t1-0.3,c.t1)));c.el.style.opacity=a;if(a<=0)continue;
  const p=project(c.anchor());p.x=clamp(p.x,60,W-60);p.y=clamp(p.y,300,H-560);const lbl=c.el.querySelector('.lbl');const lw=lbl.offsetWidth||300;
  let ex=p.x+c.dx,ey=p.y+c.dy;const left=c.dx<0;ex=left?clamp(ex,40+lw,W-40):clamp(ex,40,W-40-lw);ey=clamp(ey,320,1040);
  const lx=ex-p.x,ly=ey-p.y;const len=Math.hypot(lx,ly),ang=Math.atan2(ly,lx)*180/Math.PI;const grow=easeOut(u01(t,c.t0,c.t0+0.5));
  c.el.style.transform=`translate(${p.x}px,${p.y}px)`;c.el.querySelector('.line').style.width=(len*grow)+'px';c.el.querySelector('.line').style.transform=`rotate(${ang}deg)`;
  lbl.style.left=(lx*grow+(left?-lw:0))+'px';lbl.style.top=(ly*grow-24)+'px';lbl.style.opacity=u01(t,c.t0+0.35,c.t0+0.6);}
 // fades
 let f=0;if(t<0.7)f=1-t/0.7;if(t>T.END-0.7)f=Math.max(f,u01(t,T.END-0.7,T.END));
 fadeEl.style.opacity=f;
 const fb=t-engulfT.earth;flashEl.style.opacity=(fb>=0&&fb<0.55)?0.62*Math.pow(1-fb/0.55,2):0;
 document.getElementById('badge').style.opacity=t>=T.CTA?0:1;
}
