 const wph=(t-T.WOBBLE)*1.9;
 earthTilt.rotation.set(wob*Math.cos(wph)*0.8,0,-TILT+wob*Math.sin(wph));
 earthSpin.rotation.y=2.6+0.045*t;
 clouds.rotation.y=0.012*t;
 // moon
 const breakNow=t>=T.BREAK&&t<T.OUTRO;
 const d=t>=T.OUTRO?7.0:moonDist(t);
 const th=t>=T.OUTRO?moonTheta(0)+0.1:moonTheta(t);
 moonGroup.position.set(d*Math.cos(th),d*Math.sin(th),0);
 moonGroup.visible=!breakNow;
 // moon stretched toward Earth before break
 const stretch=t<T.BREAK?1+0.28*easeIn(u01(t,T.ROCHE,T.BREAK)):1;
 _dir.copy(moonGroup.position).negate().normalize();
 moonGroup.quaternion.setFromUnitVectors(V(1,0,0),_dir);moonGroup.scale.set(stretch,1/Math.sqrt(stretch),1/Math.sqrt(stretch));
 moon.rotation.set(0.3,1.2+0.02*t,0);
 const crack=t<T.BREAK?Math.pow(u01(t,T.ROCHE+0.2,T.BREAK),1.6):0;
 moonMat.emissiveIntensity=crack*(2.2+0.8*Math.sin(t*23)*crack);
 moonGroup.updateMatrixWorld(true);
 state.moonWorld.setFromMatrixPosition(moonGroup.matrixWorld);
 if(t<T.BREAK){moonBreakLocal.copy(moonGroup.position);thetaBreak=th;}
 else if(t<T.OUTRO){const dd=moonDist(T.BREAK),tt=moonTheta(T.BREAK);moonBreakLocal.set(dd*Math.cos(tt),dd*Math.sin(tt),0);thetaBreak=tt;}
 // tidal bulge
 let b=0;
 if(t<T.ROCHE)b=0.13*sm(u01(t,T.TIDES,T.ROCHE-1.0));
 else if(t<T.BREAK)b=lerp(0.13,0.2,u01(t,T.ROCHE,T.BREAK));
 else b=0.2*(1-sm(u01(t,T.BREAK,T.BREAK+3.0)));
 if(t>=T.OUTRO)b=0;
 if(t<T.BREAK||t>=T.OUTRO){lastMoonDirWorld.copy(state.moonWorld).normalize();}
 tideGroup.quaternion.setFromUnitVectors(V(1,0,0),lastMoonDirWorld);
 tideGroup.scale.set(1+b,1-b*0.38,1-b*0.38);
 state.bulgeTip.copy(lastMoonDirWorld).multiplyScalar(1+b+0.05);
 // lava / scorch / atmosphere
 const lava=t>=T.OUTRO?0:sm(u01(t,T.RAIN+0.6,T.RAIN+5.2));
 earthUniforms.uLavaAmt.value=lava*1.0;earthUniforms.uScorch.value=lava*0.85;earthUniforms.uLightsAmt.value=1-lava;
 atmoUniforms.uColor.value.setHex(0x3d8bff).lerp(new THREE.Color(0xff6a20),lava);
 atmoUniforms.uInt.value=1+0.5*lava;
 cloudMat.opacity=1-0.65*lava;cloudMat.color.setHex(0xffffff).lerp(new THREE.Color(0x5a4a40),lava);
 axisMat.opacity=t>=T.OUTRO?0:0.9*sm(u01(t,T.WOBBLE+0.4,T.WOBBLE+1.6));
 // fragments
 const tau=t-T.BREAK;
 rockMat.emissiveIntensity=tau>0?0.55*Math.exp(-tau/1.2):0;
 const alive=t>=T.BREAK&&t<T.OUTRO;
 for(let i=0;i<NF;i++){const f=frag[i];
  let r=alive?fragPos(f,t,_p):-1;
  if(r<0){rocks.setMatrixAt(i,zeroM);streaks.setMatrixAt(i,zeroM);}
  else{
   _q.setFromAxisAngle(f.ax,f.ph0+f.rot*t);_s.setScalar(f.size);_m.compose(_p,_q,_s);rocks.setMatrixAt(i,_m);
   if(t>f.tf&&r<1.75){const pp=new THREE.Vector3();fragPos(f,t-1/40,pp);const vel=_p.clone().sub(pp);const sp=vel.length();const len=clamp(sp*8,0.04,0.42)*(1-u01(r,1.55,1.75));
    const dir=vel.normalize();_q.setFromUnitVectors(_up,dir);const pos=_p.clone().addScaledVector(dir,-len*0.5);_s.set(f.size*0.6,len,f.size*0.6);_m.compose(pos,_q,_s);streaks.setMatrixAt(i,_m);}
   else streaks.setMatrixAt(i,zeroM);
  }
  // flash
  const fp=(t-f.tImp)/0.6;
  if(alive&&fp>=0&&fp<1){const ang=thetaBreak+f.s*Math.PI*1.05+f.w*(f.tImp-T.BREAK)+1.8;fragPos(f,f.tImp-0.001,_p);_p.normalize().multiplyScalar(1.02);
   const sc=(0.012+f.size*0.9)*(1+2.0*fp)*(1-fp*0.4);_q.identity();_s.setScalar(sc);_m.compose(_p,_q,_s);flashes.setMatrixAt(i,_m);const k=Math.pow(1-fp,1.6);flashes.setColorAt(i,new THREE.Color(1*k,0.6*k,0.25*k));}
  else{flashes.setMatrixAt(i,zeroM);}
 }
 rocks.instanceMatrix.needsUpdate=true;streaks.instanceMatrix.needsUpdate=true;flashes.instanceMatrix.needsUpdate=true;flashes.instanceColor.needsUpdate=true;
 dustMat.opacity=alive?0.75*sm(u01(tau,1.5,6.5))*(1-sm(u01(t,T.RAIN+0.5,T.RAIN+5.5))):0;
}

// ---------- camera shots
const M=()=>state.moonWorld.clone();
const shots=[
 {t0:T.HOOK,t1:T.DRIFT,fov:62,shake:0.0,cam:(u)=>({pos:V(0,-0.75+0.1*u,4.6-0.35*u),tgt:V(0,1.75+0.1*u,0)})},
 {t0:T.DRIFT,t1:T.DRIFT+3.6,fov:62,shake:0.0,cam:(u)=>{const m=M();return{pos:m.clone().add(V(0.55-0.25*u,1.35,1.45)),tgt:m.clone().add(V(0,-1.15-0.2*u,0))}}},
 {t0:T.DRIFT+3.6,t1:T.TIDES,fov:54,shake:0.0,cam:(u)=>({pos:V(2.6-0.5*u,1.9+0.3*u,6.2-0.8*u),tgt:V(0,1.9-0.2*u,0)})},
 {t0:T.TIDES,t1:T.TIDES+3.6,fov:72,shake:0.004,cam:(u)=>{const m=M();return{pos:V(1.45-0.1*u,0.32+0.15*u,1.35),tgt:m.clone().multiplyScalar(0.75).lerp(V(0,1.6,0),0.25)}}},
 {t0:T.TIDES+3.6,t1:T.ROCHE,fov:58,shake:0.005,cam:(u)=>({pos:V(0.3,-2.3+0.3*u,4.1-0.4*u),tgt:V(0,0.75+0.15*u,0)})},
 {t0:T.ROCHE,t1:T.ROCHE+3.0,fov:48,shake:0.006,cam:(u)=>{const m=M();return{pos:m.clone().add(V(0.6-0.1*u,0.18,0.78-0.08*u)),tgt:m}}},
 {t0:T.ROCHE+3.0,t1:T.RING,fov:56,shake:0.008,cam:(u)=>{const m=M();return{pos:V(1.3+0.3*u,0.4+0.1*u,3.5+0.35*u),tgt:m.clone().lerp(V(0,0,0),0.42+0.1*u)}}},
 {t0:T.RING,t1:T.RAIN,fov:50,shake:0.0,cam:(u)=>({pos:V(4.6-1.0*u,-2.1+0.9*u,4.6+1.0*u),tgt:V(0,0.25,0)})},
 {t0:T.RAIN,t1:T.RAIN+3.3,fov:56,shake:0.006,cam:(u)=>({pos:V(0.45-0.1*u,-0.7+0.3*u,3.3-0.4*u),tgt:V(0,0.75,0)})},
 {t0:T.RAIN+3.3,t1:T.WOBBLE,fov:60,shake:0.009,cam:(u)=>({pos:V(1.15-0.1*u,0.55+0.15*u,1.95-0.2*u),tgt:V(-0.25,0.45,0)})},
 {t0:T.WOBBLE,t1:T.OUTRO,fov:50,shake:0.0,cam:(u)=>({pos:V(0.2-0.4*u,0.3+0.1*u,5.0-0.5*u),tgt:V(0,0.25,0)})},
 {t0:T.OUTRO,t1:T.END+1,fov:60,shake:0.0,cam:(u)=>({pos:V(0,-0.45+0.1*u,4.5+1.3*u),tgt:V(0,1.35+0.2*u,0)})},
];
function updateCamera(t){
 let sh=shots[shots.length-1];for(const s of shots){if(t>=s.t0&&t<s.t1){sh=s;break;}}
 const u=easeInOut(u01(t,sh.t0,sh.t1));const c=sh.cam(u);
 camera.position.copy(c.pos);camera.lookAt(c.tgt);camera.fov=sh.fov;camera.updateProjectionMatrix();
 let amp=sh.shake;
 const db=t-T.BREAK;if(db>-0.15&&db<2.5)amp+=0.06*Math.exp(-Math.max(db,0)/0.75)*(db<0?(db+0.15)/0.15:1);
 if(amp>0){_e.set(noise1(t*4.1,1)*amp,noise1(t*3.7,7)*amp,noise1(t*5.3,3)*amp*0.6);const q=new THREE.Quaternion().setFromEuler(_e);camera.quaternion.multiply(q);}
 camera.updateMatrixWorld(true);
 earthUniforms.uSunDirView.value.copy(sunDir).transformDirection(camera.matrixWorldInverse);
}

// ---------- UI
const capEl=document.getElementById('cap'),ctaEl=document.getElementById('cta'),fadeEl=document.getElementById('fade'),flashEl=document.getElementById('flash'),calloutsEl=document.getElementById('callouts');
const callouts=[
 {t0:T.DRIFT+0.9,t1:T.DRIFT+3.3,text:'OGGI: +3,8 CM / ANNO',anchor:()=>M(),dx:-260,dy:220},
 {t0:T.TIDES+0.9,t1:T.TIDES+5.8,text:'MAREE: ONDE DI 300+ M',anchor:()=>state.bulgeTip.clone(),dx:-300,dy:260},
 {t0:T.ROCHE+0.6,t1:T.BREAK-0.3,text:'LIMITE DI ROCHE · 18.000 KM',anchor:()=>M(),dx:-230,dy:-330},
 {t0:T.RING+1.3,t1:T.RAIN-0.5,text:'ANELLO DI DETRITI',anchor:()=>{const a=thetaBreak-0.9;const p=V(2.5*Math.cos(a),2.5*Math.sin(a),0);return orbit.localToWorld(p)},dx:-200,dy:-240},
 {t0:T.RAIN+1.0,t1:T.WOBBLE-0.6,text:'SUPERFICIE: OCEANO DI LAVA',anchor:()=>V(-0.3,0.65,0.7),dx:-150,dy:-320},
 {t0:T.WOBBLE+1.3,t1:T.OUTRO-0.6,text:'ASSE: OSCILLAZIONE ±30°',anchor:()=>{const p=V(0,1.75,0);return earthTilt.localToWorld(p)},dx:160,dy:-230},
];
for(const c of callouts){const d=document.createElement('div');d.className='callout';d.innerHTML=`<div class="dot"></div><div class="line"></div><div class="lbl">${c.text}</div>`;calloutsEl.appendChild(d);c.el=d;}
function project(v){const p=v.clone().project(camera);return{x:(p.x*0.5+0.5)*W,y:(-p.y*0.5+0.5)*H,z:p.z};}
function updateUI(t){
 // captions
 let html='',cls='';
 for(const s of TL.sentences){
  if(t<s.chunks[0].s-0.08||t>s.end+0.35)continue;
  for(let i=0;i<s.chunks.length;i++){const ch=s.chunks[i];const next=s.chunks[i+1];const hold=next?next.s:ch.e+0.35;
   if(t>=ch.s-0.08&&t<hold){
    const words=(s.id==='hook')?s.words:ch.words;
    html=words.map(w=>{const st=t<w.s?'future':(t<w.e+0.04?'hot':'past');const pop=st==='hot'?1+0.10*(1-u01(t,w.s,w.s+0.16)):1;return `<span class="${st}" style="transform:scale(${pop.toFixed(3)})">${w.w}</span>`}).join(' ');
    const a=u01(t,ch.s-0.08,ch.s+0.1);const sc=0.9+0.1*easeOut(a);
    capEl.style.opacity=a;capEl.style.transform=`translate(-50%,-50%) scale(${sc.toFixed(3)})`;
    cls=s.id==='hook'?'title':'';break;}
  }
  if(html)break;
 }
 capEl.innerHTML=html;capEl.className=cls;if(!html)capEl.style.opacity=0;
 // cta
 const ca=t>=T.CTA?sm(u01(t,T.CTA,T.CTA+0.5)):0;ctaEl.style.opacity=ca;ctaEl.style.transform=`translateX(-50%) translateY(${(1-ca)*30}px)`;
 // callouts
 for(const c of callouts){const a=Math.min(sm(u01(t,c.t0,c.t0+0.35)),1-sm(u01(t,c.t1-0.3,c.t1)));c.el.style.opacity=a;if(a<=0)continue;
  const p=project(c.anchor());p.x=clamp(p.x,60,W-60);p.y=clamp(p.y,300,H-560);const lbl=c.el.querySelector('.lbl');const lw=lbl.offsetWidth||300;
  let ex=p.x+c.dx,ey=p.y+c.dy;const left=c.dx<0;ex=left?clamp(ex,40+lw,W-40):clamp(ex,40,W-40-lw);ey=clamp(ey,320,1040);
  const lx=ex-p.x,ly=ey-p.y;const len=Math.hypot(lx,ly),ang=Math.atan2(ly,lx)*180/Math.PI;const grow=easeOut(u01(t,c.t0,c.t0+0.5));
  c.el.style.transform=`translate(${p.x}px,${p.y}px)`;c.el.querySelector('.line').style.width=(len*grow)+'px';c.el.querySelector('.line').style.transform=`rotate(${ang}deg)`;
  lbl.style.left=(lx*grow+(left?-lw:0))+'px';lbl.style.top=(ly*grow-24)+'px';lbl.style.opacity=u01(t,c.t0+0.35,c.t0+0.6);}
 // fades
 let f=0;if(t<0.7)f=1-t/0.7;const dd=Math.abs(t-T.OUTRO);if(dd<0.45)f=Math.max(f,1-dd/0.45);if(t>T.END-0.7)f=Math.max(f,u01(t,T.END-0.7,T.END));
 fadeEl.style.opacity=f;
 const fb=t-T.BREAK;flashEl.style.opacity=(fb>=0&&fb<0.45)?0.65*Math.pow(1-fb/0.45,2):0;
 document.getElementById('badge').style.opacity=t>=T.CTA?0:1;
}

window.seek=async function(t){updateWorld(t);updateCamera(t);updateUI(t);composer.render();return true;};
