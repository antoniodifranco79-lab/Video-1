<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const W=1080,H=1920;
const TL=await (await fetch('./timeline.json')).json();
const S={}; for(const s of TL.sentences) S[s.id]=s;
const T={ HOOK:0, COVER:S.cover.start, DRAIN:S.drain.start, REVEAL:S.reveal.start, CLIMATE:S.climate.start,
          LIFE:S.life.start, DESERT:S.desert.start, OUTRO:S.outro.start, CTA:S.cta.start, END:TL.total };

const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const sm=(t)=>{t=clamp(t,0,1);return t*t*(3-2*t)};
const easeOut=(t)=>{t=clamp(t,0,1);return 1-Math.pow(1-t,3)};
const easeInOut=(t)=>{t=clamp(t,0,1);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const u01=(t,a,b)=>clamp((t-a)/(b-a),0,1);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const noise1=(t,s)=>Math.sin(t*1.7+s)*0.5+Math.sin(t*3.1+s*2.3)*0.3+Math.sin(t*6.3+s*0.7)*0.2;
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const CGET=(h)=>new THREE.Color(h);

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(1);renderer.setSize(W,H);
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.04;
document.body.insertBefore(renderer.domElement,document.getElementById('ui'));
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(50,W/H,0.02,400);
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(W,H),0.6,0.5,0.82);
composer.addPass(bloom);
composer.addPass(new OutputPass());

const loader=new THREE.TextureLoader();
const load=(u,srgb=true)=>new Promise((res,rej)=>loader.load(u,t=>{if(srgb)t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;res(t)},undefined,rej));
const [texEarth,texSpec,texNorm,texLights,texClouds]=await Promise.all([
 load('../assets/textures/earth_atmos_2048.jpg'),load('../assets/textures/earth_specular_2048.jpg',false),load('../assets/textures/earth_normal_2048.jpg',false),
 load('../assets/textures/earth_lights_2048.png'),load('../assets/textures/earth_clouds_1024.png')]);

function makeSoftSprite(){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');const gr=g.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(0.3,'rgba(255,255,255,0.6)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,128,128);return new THREE.CanvasTexture(c);}
const texSoft=makeSoftSprite();
function makeNoiseTex(){
 const Wd=512,Hd=256;const c=document.createElement('canvas');c.width=Wd;c.height=Hd;const g=c.getContext('2d');const img=g.createImageData(Wd,Hd);const rnd=mulberry32(91);
 const oct=[{s:6,a:0.5},{s:13,a:0.28},{s:27,a:0.15},{s:54,a:0.07}];
 const grids=oct.map(o=>{const gw=o.s+1,gh=Math.max(2,Math.round(o.s/2)+1);const arr=new Float32Array(gw*gh);for(let i=0;i<arr.length;i++)arr[i]=rnd();return{gw,gh,arr,a:o.a};});
 const ss=(t)=>t*t*(3-2*t);
 for(let y=0;y<Hd;y++)for(let x=0;x<Wd;x++){let v=0,am=0;
  for(const G of grids){const fx=x/Wd*(G.gw-1),fy=y/Hd*(G.gh-1);const x0=Math.floor(fx),y0=Math.floor(fy);const tx=ss(fx-x0),ty=ss(fy-y0);
   const x1=Math.min(x0+1,G.gw-1),y1=Math.min(y0+1,G.gh-1);
   const a=G.arr[y0*G.gw+x0],b=G.arr[y0*G.gw+x1],cc=G.arr[y1*G.gw+x0],d=G.arr[y1*G.gw+x1];
   const top=a+(b-a)*tx,bot=cc+(d-cc)*tx;v+=(top+(bot-top)*ty)*G.a;am+=G.a;}
  v/=am;const px=(y*Wd+x)*4;const val=clamp(v*255,0,255);img.data[px]=img.data[px+1]=img.data[px+2]=val;img.data[px+3]=255;}
 g.putImageData(img,0,0);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;
}
const texNoise=makeNoiseTex();

// lights
const sunDir=V(1.0,0.35,0.55).normalize();
const sun=new THREE.DirectionalLight(0xfff4e2,2.6);sun.position.copy(sunDir).multiplyScalar(60);scene.add(sun);
const amb=new THREE.AmbientLight(0x2a3a55,0.4);scene.add(amb);

// stars + nebulae
{ const rnd=mulberry32(99);const N=5500;const pos=new Float32Array(N*3),col=new Float32Array(N*3),siz=new Float32Array(N);
 for(let i=0;i<N;i++){const u=rnd()*2-1,ph=rnd()*Math.PI*2,r=Math.sqrt(1-u*u);pos[i*3]=r*Math.cos(ph)*160;pos[i*3+1]=u*160;pos[i*3+2]=r*Math.sin(ph)*160;
  const tt=rnd();const c=new THREE.Color().setHSL(tt<0.15?0.6:tt<0.25?0.08:0.0,tt<0.25?0.5:0,0.75+rnd()*0.25);col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;siz[i]=rnd()<0.08?3.0+rnd()*3:1.1+rnd()*1.5;}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));g.setAttribute('aSize',new THREE.BufferAttribute(siz,1));
 const m=new THREE.ShaderMaterial({uniforms:{tex:{value:texSoft}},vertexShader:`attribute float aSize;varying vec3 vC;void main(){vC=color;vec4 mv=modelViewMatrix*vec4(position,1.0);gl_PointSize=aSize*1.6;gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`uniform sampler2D tex;varying vec3 vC;void main(){vec4 s=texture2D(tex,gl_PointCoord);gl_FragColor=vec4(vC*1.1,s.a*0.95);}`,vertexColors:true,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
 scene.add(new THREE.Points(g,m));
 const neb=(x,y,z,c,s,o)=>{const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:texSoft,color:c,transparent:true,opacity:o,depthWrite:false,blending:THREE.AdditiveBlending}));sp.position.set(x,y,z);sp.scale.set(s,s,1);scene.add(sp);};
 neb(-70,40,-120,0x2a3a7a,180,0.28);neb(60,-30,-130,0x1a3a5a,160,0.24);
}

// ---------- EARTH with draining-ocean shader
const earthTilt=new THREE.Group();scene.add(earthTilt);earthTilt.rotation.z=-23.4*Math.PI/180;
const earthSpin=new THREE.Group();earthTilt.add(earthSpin);
const earthUniforms={uSunDirView:{value:new THREE.Vector3(0,0,1)},uOceanMask:{value:texSpec},uNoise:{value:texNoise},uDrain:{value:0},uLightsAmt:{value:1.0}};
const earthMat=new THREE.MeshPhongMaterial({map:texEarth,specularMap:texSpec,specular:CGET(0x556070),shininess:26,normalMap:texNorm,normalScale:new THREE.Vector2(0.75,0.75),emissiveMap:texLights,emissive:CGET(0xffffff),emissiveIntensity:0.9});
earthMat.onBeforeCompile=(sh)=>{Object.assign(sh.uniforms,earthUniforms);
 sh.fragmentShader=sh.fragmentShader
 .replace('#include <common>','#include <common>\nuniform vec3 uSunDirView;uniform sampler2D uOceanMask;uniform sampler2D uNoise;uniform float uDrain;uniform float uLightsAmt;\nfloat _ow;')
 .replace('#include <map_fragment>',`#include <map_fragment>
  { float ocean=texture2D(uOceanMask,vMapUv).r;
    float dN=texture2D(uNoise,vMapUv*2.3).r;
    float depth=clamp(0.10+0.95*dN,0.0,1.0);
    float water=ocean*step(uDrain,depth);
    float exposed=ocean*(1.0-step(uDrain,depth));
    float dry=clamp((uDrain-depth)*3.0,0.0,1.0);
    vec3 wcol=mix(vec3(0.03,0.27,0.47),vec3(0.006,0.07,0.19),depth);
    vec3 sea=mix(vec3(0.08,0.10,0.095),vec3(0.47,0.38,0.25),dry);
    vec3 land=mix(diffuseColor.rgb,vec3(0.48,0.35,0.20),clamp(uDrain*0.9,0.0,1.0)*(1.0-ocean));
    diffuseColor.rgb=land;
    diffuseColor.rgb=mix(diffuseColor.rgb,sea,exposed);
    diffuseColor.rgb=mix(diffuseColor.rgb,wcol,water);
    _ow=water; }`)
 .replace('#include <specularmap_fragment>','#include <specularmap_fragment>\n specularStrength*=_ow;')
 .replace('#include <emissivemap_fragment>','#include <emissivemap_fragment>\n { float dayF=smoothstep(-0.12,0.18,dot(normalize(vNormal),uSunDirView)); totalEmissiveRadiance*=(1.0-dayF)*uLightsAmt; }');};
const earth=new THREE.Mesh(new THREE.SphereGeometry(1,180,180),earthMat);earthSpin.add(earth);

const cloudMat=new THREE.MeshLambertMaterial({map:texClouds,transparent:true,opacity:1,depthWrite:false});
const clouds=new THREE.Mesh(new THREE.SphereGeometry(1.013,120,120),cloudMat);earthSpin.add(clouds);

const atmoU={uColor:{value:CGET(0x3d8bff)},uSunDir:{value:sunDir.clone()},uPow:{value:3.0},uInt:{value:1.0}};
const atmoMat=new THREE.ShaderMaterial({uniforms:atmoU,transparent:true,side:THREE.BackSide,depthWrite:false,blending:THREE.AdditiveBlending,
 vertexShader:`varying vec3 vN;varying vec3 vP;varying vec3 vWN;void main(){vN=normalize(normalMatrix*normal);vWN=normalize(mat3(modelMatrix)*normal);vec4 mv=modelViewMatrix*vec4(position,1.0);vP=mv.xyz;gl_Position=projectionMatrix*mv;}`,
 fragmentShader:`uniform vec3 uColor;uniform vec3 uSunDir;uniform float uPow;uniform float uInt;varying vec3 vN;varying vec3 vP;varying vec3 vWN;void main(){vec3 vd=normalize(-vP);float rim=pow(clamp(0.72-dot(vN,vd),0.0,1.0),uPow)*1.7;float day=clamp(dot(vWN,uSunDir)*1.6+0.55,0.08,1.0);gl_FragColor=vec4(uColor*rim*day*uInt,1.0);}`});
const atmo=new THREE.Mesh(new THREE.SphereGeometry(1.085,96,96),atmoMat);earthTilt.add(atmo);
const hazeMat=new THREE.ShaderMaterial({uniforms:atmoU,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
 vertexShader:atmoMat.vertexShader,fragmentShader:`uniform vec3 uColor;uniform vec3 uSunDir;uniform float uInt;varying vec3 vN;varying vec3 vP;varying vec3 vWN;void main(){vec3 vd=normalize(-vP);float f=pow(1.0-clamp(dot(vN,vd),0.0,1.0),3.2)*0.85;float day=clamp(dot(vWN,uSunDir)*1.4+0.4,0.05,1.0);gl_FragColor=vec4(uColor*f*day*uInt,1.0);}`});
const haze=new THREE.Mesh(new THREE.SphereGeometry(1.02,96,96),hazeMat);earthSpin.add(haze);

// ---------- particle shell (vapor rising / dust), reused for two tints
function makeShell(seed,col){
 const N=2600;const dir=new Float32Array(N*3),seed_=new Float32Array(N);const r=mulberry32(seed);
 for(let i=0;i<N;i++){const u=r()*2-1,ph=r()*Math.PI*2,rr=Math.sqrt(1-u*u);dir[i*3]=rr*Math.cos(ph);dir[i*3+1]=u;dir[i*3+2]=rr*Math.sin(ph);seed_[i]=r();}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(dir,3));g.setAttribute('aSeed',new THREE.BufferAttribute(seed_,1));
 const m=new THREE.ShaderMaterial({uniforms:{tex:{value:texSoft},uTime:{value:0},uAmt:{value:0},uCol:{value:CGET(col)},uRise:{value:0.6}},
  vertexShader:`attribute float aSeed;uniform float uTime;uniform float uRise;uniform float uAmt;varying float vA;void main(){float ph=fract(uTime*0.11+aSeed);float rr=1.015+ph*uRise;vec3 p=position*rr;vec4 mv=modelViewMatrix*vec4(p,1.0);gl_PointSize=(uAmt>0.001)?clamp((3.0+7.0*ph)*(38.0/-mv.z),1.5,42.0):0.0;vA=(1.0-ph)*smoothstep(0.0,0.1,ph);gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`uniform sampler2D tex;uniform float uAmt;uniform vec3 uCol;varying float vA;void main(){vec4 s=texture2D(tex,gl_PointCoord);gl_FragColor=vec4(uCol,s.a*vA*uAmt);}`,
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
 const pts=new THREE.Points(g,m);pts.frustumCulled=false;earthSpin.add(pts);return m;
}
const vapor=makeShell(5,0xcdecff); vapor.uniforms.uRise.value=0.42;
const dust=makeShell(9,0xc49a5c); dust.uniforms.uRise.value=0.32;

// ---------- drain curve
function drain(t){
 if(t<T.DRAIN) return 0;
 if(t<T.REVEAL) return lerp(0.0,0.5,easeInOut(u01(t,T.DRAIN,T.REVEAL)));
 if(t<T.CLIMATE) return lerp(0.5,0.76,easeInOut(u01(t,T.REVEAL,T.CLIMATE)));
 if(t<T.LIFE) return lerp(0.76,0.88,u01(t,T.CLIMATE,T.LIFE));
 if(t<T.DESERT) return lerp(0.88,0.95,u01(t,T.LIFE,T.DESERT));
 if(t<T.OUTRO) return lerp(0.95,1.0,u01(t,T.DESERT,T.OUTRO));
 return lerp(1.0,0.0,easeInOut(u01(t,T.OUTRO,T.OUTRO+3.2)));
}

function updateWorld(t){
 earthSpin.rotation.y=2.3+0.05*t;
 clouds.rotation.y=0.013*t;
 const d=drain(t);earthUniforms.uDrain.value=d;
 // city lights die as civilization collapses, return at outro
 earthUniforms.uLightsAmt.value=clamp(1.0-sm(u01(d,0.04,0.55)),0.0,1.0);
 // clouds: thin out with drain (brief thickening early), vanish by climate
 const cl=clamp(1.0 - sm(u01(t,T.DRAIN+0.8,T.CLIMATE+0.8)),0.0,1.0);
 cloudMat.opacity=cl;cloudMat.color.copy(CGET(0xffffff).lerp(CGET(0xb8a488),sm(d)));
 // atmosphere blue -> dusty brown
 const brown=sm(d);
 atmoU.uColor.value.copy(CGET(0x3d8bff).lerp(CGET(0xc79a5a),brown));
 atmoU.uInt.value=1.0-0.25*brown;
 // vapor during drain->climate; dust during desert
 vapor.uniforms.uTime.value=t;dust.uniforms.uTime.value=t;
 vapor.uniforms.uAmt.value=0.34*sm(u01(t,T.DRAIN,T.DRAIN+2.0))*(1.0-sm(u01(t,T.REVEAL-0.3,T.REVEAL+2.6)));
 dust.uniforms.uAmt.value=0.30*sm(u01(t,T.DESERT-1.2,T.DESERT+1.2))*(1.0-sm(u01(t,T.OUTRO+0.5,T.OUTRO+2.6)));
 // warm the sun light as it turns to desert
 sun.color.copy(CGET(0xfff4e2).lerp(CGET(0xffd9a0),brown*0.8));
 amb.color.copy(CGET(0x2a3a55).lerp(CGET(0x4a3a2a),brown));
}

// ---------- camera
const shots=[
 {t0:T.HOOK,t1:T.COVER,fov:56,shake:0,cam:(u)=>({pos:V(0.1,-0.35+0.1*u,4.5-0.3*u),tgt:V(0,0.15,0)})},
 {t0:T.COVER,t1:T.DRAIN,fov:52,shake:0,cam:(u)=>({pos:V(-1.8+0.4*u,0.9,4.0),tgt:V(0,0.0,0)})},
 {t0:T.DRAIN,t1:T.REVEAL,fov:44,shake:0.003,cam:(u)=>({pos:V(1.1-0.2*u,0.25,2.35-0.25*u),tgt:V(0.15,0.0,0)})},
 {t0:T.REVEAL,t1:T.REVEAL+3.3,fov:44,shake:0.0035,cam:(u)=>({pos:V(1.5-0.3*u,0.55,2.9-0.2*u),tgt:V(0,-0.02,0)})},
 {t0:T.REVEAL+3.3,t1:T.CLIMATE,fov:46,shake:0.003,cam:(u)=>({pos:V(-1.0-0.2*u,-0.3,2.7+0.3*u),tgt:V(0,-0.05,0)})},
 {t0:T.CLIMATE,t1:T.LIFE,fov:50,shake:0.002,cam:(u)=>({pos:V(0.4,0.8-0.2*u,3.9-0.3*u),tgt:V(0,0.1,0)})},
 {t0:T.LIFE,t1:T.DESERT,fov:46,shake:0.003,cam:(u)=>({pos:V(1.3-0.2*u,-0.2,2.7-0.2*u),tgt:V(0,0,0)})},
 {t0:T.DESERT,t1:T.OUTRO,fov:52,shake:0.004,cam:(u)=>({pos:V(-0.5+0.3*u,0.35,3.6+0.4*u),tgt:V(0,0.05,0)})},
 {t0:T.OUTRO,t1:T.END+1,fov:56,shake:0,cam:(u)=>({pos:V(0,-0.25+0.1*u,4.3+1.2*u),tgt:V(0,0.15,0)})},
];
function updateCamera(t){
 let sh=shots[shots.length-1];for(const s of shots){if(t>=s.t0&&t<s.t1){sh=s;break;}}
 const u=easeInOut(u01(t,sh.t0,sh.t1));const c=sh.cam(u);
 camera.position.copy(c.pos);camera.lookAt(c.tgt);camera.fov=sh.fov;camera.updateProjectionMatrix();
 let amp=sh.shake;
 if(amp>0){const e=new THREE.Euler(noise1(t*3.6,1)*amp,noise1(t*3.1,7)*amp,noise1(t*4.7,3)*amp*0.6);camera.quaternion.multiply(new THREE.Quaternion().setFromEuler(e));}
 camera.updateMatrixWorld(true);
 earthUniforms.uSunDirView.value.copy(sunDir).transformDirection(camera.matrixWorldInverse);
}

// ---------- UI
const capEl=document.getElementById('cap'),ctaEl=document.getElementById('cta'),fadeEl=document.getElementById('fade'),dustEl=document.getElementById('dust'),calloutsEl=document.getElementById('callouts');
const M=()=>new THREE.Vector3(0,0,0);

  c.el.style.transform=`translate(${p.x}px,${p.y}px)`;c.el.querySelector('.line').style.width=(len*grow)+'px';c.el.querySelector('.line').style.transform=`rotate(${ang}deg)`;

 let f=0;if(t<0.7)f=1-t/0.7;const dd=Math.abs(t-T.DESERT);if(dd<0.4)f=Math.max(f,(1-dd/0.4)*0.5);if(t>T.END-0.7)f=Math.max(f,u01(t,T.END-0.7,T.END));

 document.getElementById('badge').style.opacity=t>=T.CTA?0:1;
}
