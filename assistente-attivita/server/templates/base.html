<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>{% block titolo %}Assistente{% endblock %}</title>
<style>
:root {
  --bg: #F3F2F7; --surface: #FFFFFF; --surface-2: #ECEAF3; --ink: #1F1B2E; --muted: #625D73; --line: #DAD6E5;
  --accent: #A3195B; --accent-ink: #FFFFFF; --accent-soft: #F8E3EC; --ok: #1E7A46; --ok-soft: #E1F3E8;
  --warn: #9A5B00; --warn-soft: #FBEFD9; --bad: #B42318; --bad-soft: #FDE7E5;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #141220; --surface: #1D1A2C; --surface-2: #272339; --ink: #EEEAF7; --muted: #A9A3BC; --line: #36314C;
    --accent: #F06BA6; --accent-ink: #1A0712; --accent-soft: #3A1B2C; --ok: #6BD49A; --ok-soft: #173826;
    --warn: #F2B35C; --warn-soft: #3A2A12; --bad: #FF8A80; --bad-soft: #3D1916; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font); padding: 20px max(16px, env(safe-area-inset-left)) 48px; }
.wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 18px; }
h1 { font-size: 1.6rem; margin: 0; line-height: 1.2; }
h2 { font-size: 1.1rem; margin: 0; }
a { color: var(--accent); }
.top { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.muted { color: var(--muted); font-size: .88rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.kpi { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.kpi b { display: block; font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.kpi span { font-size: .78rem; color: var(--muted); }
.flash { border-radius: 10px; padding: 10px 14px; }
.flash.ok { background: var(--ok-soft); color: var(--ok); }
.flash.errore { background: var(--bad-soft); color: var(--bad); }
.btn { display: inline-block; border: 0; border-radius: 999px; padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer; background: var(--accent); color: var(--accent-ink); text-decoration: none; }
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
.btn.small { padding: 4px 10px; font-size: .82rem; }
form.inline { display: inline; }
label { display: grid; gap: 4px; font-size: .82rem; color: var(--muted); }
input, select, textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; width: 100%; }
input[type=checkbox] { width: auto; }
textarea { min-height: 120px; }
.campi { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; align-items: end; }
.giorno { display: grid; gap: 6px; }
.giorno h3 { font-size: .95rem; margin: 0; }
.riga { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; }
.riga .ora { font-weight: 700; font-variant-numeric: tabular-nums; }
.pill { font-size: .72rem; border-radius: 999px; padding: 1px 8px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.vuoto { color: var(--muted); font-size: .88rem; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: .78rem; }
details summary { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<div class="wrap">
{% if ok %}<div class="flash ok" role="status">{{ ok }}</div>{% endif %}
{% if errore %}<div class="flash errore" role="alert">{{ errore }}</div>{% endif %}
{% block corpo %}{% endblock %}
</div>
</body>
</html>
